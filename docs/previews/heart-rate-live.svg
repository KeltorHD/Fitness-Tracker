<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900"><rect x="0" y="0" width="390" height="900" rx="0" fill="#ffffff"/><rect x="0" y="0" width="390" height="28" rx="0" fill="#fff0e8"/><text x="195" y="19" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700" fill="#9b4b25" text-anchor="middle">ДЕМО-МАКЕТ · НЕ СКРИНШОТ XCODE</text><text x="28" y="63" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#191919" text-anchor="start">9:41</text><text x="307" y="63" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700" fill="#191919" text-anchor="start">▮▮▮</text><rect x="338" y="51" width="27" height="13" rx="4" fill="none" stroke="#191919"/><rect x="341" y="54" width="19" height="7" rx="1" fill="#191919"/><text x="195" y="897" font-family="DejaVu Sans,sans-serif" font-size="8" font-weight="400" fill="#8e8e93" text-anchor="middle">Демонстрационные данные · проверка SwiftUI на Mac</text><rect x="0" y="78" width="390" height="793" rx="0" fill="#f2f2f7"/><text x="16" y="110" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#ff4f33" text-anchor="start">‹ Настройки</text><text x="16" y="150" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#191919" text-anchor="start">Трекер</text><rect x="16" y="173" width="358" height="103" rx="22" fill="white"/><text x="30" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Модель трекера</text><text x="358" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#8e8e93" text-anchor="end">AirPods Pro 3  ⌄</text><rect x="30" y="221" width="344" height="0.5" rx="0" fill="#e5e5e5"/><text x="30" y="252" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start">Режим трекера</text><text x="358" y="252" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#8e8e93" text-anchor="end">Apple «Здоровье»  ⌄</text><text x="30" y="307" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">ПУЛЬС ВО ВРЕМЯ ТРЕНИРОВКИ</text><rect x="16" y="321" width="358" height="375" rx="22" fill="white"/><text x="30" y="347" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#191919" text-anchor="start">Наденьте AirPods Pro 3 и подключите их к</text><text x="30" y="365" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#191919" text-anchor="start">iPhone. В настройках iOS → AirPods → Пульс</text><text x="30" y="383" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#191919" text-anchor="start">включите измерение. Затем начните тренировку в</text><text x="30" y="401" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#191919" text-anchor="start">FitnessTracker и включите приём пульса.</text><text x="30" y="449" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">Этот режим предназначен для AirPods Pro 3 с</text><text x="30" y="465" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">датчиком пульса. iOS выбирает доступный</text><text x="30" y="481" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">источник; вместе с AirPods может использоваться</text><text x="30" y="497" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">Apple Watch.</text><text x="30" y="536" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#ef4b4b" text-anchor="start">♥</text><text x="63" y="536" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="500" fill="#191919" text-anchor="start">128 уд/мин</text><text x="30" y="563" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">Приём пульса включён. Если измерения нет,</text><text x="30" y="579" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#8e8e93" text-anchor="start">проверьте посадку AirPods и доступ к пульсу.</text><text x="30" y="632" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#ff4f33" text-anchor="start">Остановить приём пульса</text><text x="30" y="672" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#ff4f33" text-anchor="start">Инструкция производителя  ↗</text><text x="30" y="718" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="400" fill="#8e8e93" text-anchor="start">Для приёма нужен доступ к пульсу и тренировкам в</text><text x="30" y="733" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="400" fill="#8e8e93" text-anchor="start">«Здоровье». Запись тренировки в «Здоровье» остаётся</text><text x="30" y="748" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="400" fill="#8e8e93" text-anchor="start">отдельным действием.</text><rect x="16" y="775" width="358" height="79" rx="22" fill="white"/><text x="30" y="800" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#191919" text-anchor="start">День</text><text x="358" y="800" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#8e8e93" text-anchor="end">30 октября 2026</text><text x="30" y="834" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#ff4f33" text-anchor="start">Прочитать показатели</text><rect x="142" y="879" width="106" height="5" rx="3" fill="#171717"/></svg>