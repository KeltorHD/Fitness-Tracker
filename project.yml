name: FitLife
options:
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: '26.0'
  projectFormat: xcode16_0
  developmentLanguage: ru
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
settings:
  base:
    FITNESS_TRACKER_CLOUD_SYNC_AVAILABLE: 'YES'
    FITNESS_TRACKER_AUTH_CALLBACK_MODE: https
  configs:
    Debug:
      FITNESS_TRACKER_APS_ENVIRONMENT: development
    Release:
      FITNESS_TRACKER_APS_ENVIRONMENT: production
    PersonalDebug:
      FITNESS_TRACKER_CLOUD_SYNC_AVAILABLE: 'NO'
      FITNESS_TRACKER_AUTH_CALLBACK_MODE: customScheme
    PersonalRelease:
      FITNESS_TRACKER_CLOUD_SYNC_AVAILABLE: 'NO'
      FITNESS_TRACKER_AUTH_CALLBACK_MODE: customScheme
configs:
  Debug: debug
  Release: release
  PersonalDebug: debug
  PersonalRelease: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  PersonalDebug: Config/Base.xcconfig
  PersonalRelease: Config/Base.xcconfig
packages:
  FitLifeCore:
    path: .
fileGroups:
  - README.md
  - MAC_BUILD_GUIDE.md
  - docs
  - Config
schemes:
  FitLife Personal:
    build:
      targets:
        FitLife: all
    run:
      config: PersonalDebug
    test:
      config: PersonalDebug
      targets:
        - FitLifeTests
        - FitLifeUITests
    profile:
      config: PersonalRelease
    archive:
      config: PersonalRelease
  FitLife:
    build:
      targets:
        FitLife: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitLifeTests
        - FitLifeUITests
  FitLifeWatch:
    build:
      targets:
        FitLifeWatch: all
    run:
      config: Debug
  FitLifeWidgets:
    build:
      targets:
        FitLifeWidgets: all
targets:
  FitLife:
    type: application
    platform: iOS
    sources:
      - Apple/App
      - Apple/Design
      - Apple/Features
      - Apple/Persistence
      - Apple/Services
      - Apple/Shared
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/ExerciseMedia
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FITNESS_TRACKER_BUNDLE_ID)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FITLIFE_APP
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
      configs:
        PersonalDebug:
          CODE_SIGN_ENTITLEMENTS: Config/PersonalTeam.entitlements
        PersonalRelease:
          CODE_SIGN_ENTITLEMENTS: Config/PersonalTeam.entitlements
    dependencies:
      - package: FitLifeCore
      - target: FitLifeWidgets
        embed: true
      - target: FitLifeWatch
        embed: true
    # Capabilities are declared in real entitlements, not invented XcodeGen keys.
  FitLifeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Apple/Widgets
      - Apple/Shared
      - Apple/Design/FitnessColorTheme.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FITNESS_TRACKER_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    dependencies:
      - package: FitLifeCore
  FitLifeWatch:
    type: application
    platform: watchOS
    sources:
      - Apple/Watch
      - Apple/Shared/L10n.swift
      - Apple/Shared/AppCompatibility.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/WatchAssets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FITNESS_TRACKER_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Config/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Watch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SKIP_INSTALL: YES
    dependencies:
      - package: FitLifeCore
  FitLifeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apple/Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FITNESS_TRACKER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FitLife
      - package: FitLifeCore
  FitLifeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apple/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FITNESS_TRACKER_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FitLife
