name: Authentication and Backend
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      FITLIFE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash scripts/check-server.sh
