name: Linux Core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install resource validator dependencies
        run: apt-get update && apt-get install -y python3 python3-yaml
      - name: Build core, test, validate resources and parse Apple syntax
        run: bash scripts/check-linux.sh
